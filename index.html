<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="b&c">
    <meta name="theme-color" content="#606060">

    <meta name="msapplication-starturl" content="/">
    <meta name="msapplication-navbutton-color" content="#606060">

    <meta name="apple-mobile-web-app-title" content="b&c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('ui-theme');
                var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                document.documentElement.setAttribute('data-theme', theme);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0f19' : '#f8f7f4');
            } catch (e) { }
        })();
    </script>
</head>

</body>
